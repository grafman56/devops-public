# Install the ingress controller before applying the overlays.
# Chart: ingress-nginx 4.15.1 (controller v1.15.1), verified on 2026-10-21.
#
#   helm repo add ingress-nginx https://kubernetes.github.io/ingress-nginx
#   helm repo update
#   helm upgrade --install ingress-nginx ingress-nginx/ingress-nginx \
#     --version 4.15.1 \
#     --namespace ingress-nginx --create-namespace \
#     -f kubernetes/helm/values-ingress-nginx.yaml

controller:
  replicaCount: 2

  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  # NodePort keeps the example usable on a lab cluster without a
  # load balancer. Switch to LoadBalancer when one exists.
  service:
    type: NodePort

  metrics:
    enabled: true

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  # Spread replicas across nodes.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
