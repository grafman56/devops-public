---
# Placeholder address from the RFC 5737 documentation range.
# Replace it with the address of your Windows host.
all:
  children:
    windows_iis:
      vars:
        ansible_connection: winrm
        ansible_port: 5986
        ansible_user: ansible
        ansible_password: "{{ vault_windows_iis_local_password }}"
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
      hosts:
        iis01:
          ansible_host: 192.0.2.21
