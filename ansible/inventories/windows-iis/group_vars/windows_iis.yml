---
iis_site_name: ExampleSite
iis_site_path: C:\sites\example
iis_app_pool: ExampleAppPool
iis_port: 8080
iis_content: |
  <!doctype html>
  <html lang="en">
    <head><meta charset="utf-8"><title>Example</title></head>
    <body><h1>Example site</h1><p>Served by IIS on {{ inventory_hostname }}.</p></body>
  </html>

# Local service account. The password comes from vault.yml.
iis_local_user: svc-example
iis_local_password: "{{ vault_windows_iis_local_password }}"
