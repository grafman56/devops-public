---
# Container host settings for hosts in the "docker_hosts" group.
docker_users:
  - deploy
  - ops

docker_compose_project: example
docker_compose_dir: /opt/example

docker_web_image: nginx:1.30.6-alpine
docker_db_image: postgres:18.6-trixie
docker_web_port: 8080
docker_db_port: 5432

docker_db_name: appdb
docker_db_user: appuser
docker_db_password: "{{ vault_docker_db_password }}"
