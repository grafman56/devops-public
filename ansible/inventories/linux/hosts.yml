---
# Placeholder addresses from the RFC 5737 documentation range.
# Replace them with the addresses Terraform printed, or with your DHCP
# reservations. Never commit real device addresses to a template repo.
all:
  children:
    linux:
      vars:
        ansible_user: ansible
        ansible_ssh_private_key_file: ~/.ssh/lab_ed25519
      children:
        web:
          hosts:
            web01:
              ansible_host: 192.0.2.11
        database:
          hosts:
            db01:
              ansible_host: 192.0.2.12
        docker_hosts:
          hosts:
            app01:
              ansible_host: 192.0.2.13
