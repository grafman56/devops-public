---
# Install steps follow the official Docker documentation:
# https://docs.docker.com/engine/install/ubuntu/
# https://docs.docker.com/engine/install/debian/

- name: Install repository prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create the apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install the Docker repository signing key
  ansible.builtin.get_url:
    url: "{{ docker_apt_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

# Docker documents the deb822 format for current Debian and Ubuntu releases.
- name: Add the Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: "{{ docker_apt_uri }}"
    suites: "{{ docker_apt_suite }}"
    components: [stable]
    architectures: ["{{ docker_apt_arch }}"]
    signed_by: /etc/apt/keyrings/docker.asc
    state: present
    enabled: true

- name: Install Docker Engine
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  loop_control:
    label: "{{ item }}"

- name: Write the Docker daemon configuration
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart Docker

- name: Create the compose project directory
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the web content directory
  ansible.builtin.file:
    path: "{{ docker_compose_dir }}/html"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write the web content
  ansible.builtin.copy:
    content: |
      <!doctype html>
      <html lang="en">
        <head><meta charset="utf-8"><title>Compose example</title></head>
        <body><h1>Compose example</h1><p>nginx and PostgreSQL on {{ inventory_hostname }}.</p></body>
      </html>
    dest: "{{ docker_compose_dir }}/html/index.html"
    owner: root
    group: root
    mode: "0644"

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ docker_compose_dir }}/compose.yaml"
    owner: root
    group: root
    mode: "0644"

# Compose reads .env from the project directory. Keep the secret out of the
# compose file and out of the repository.
- name: Write the compose environment file
  ansible.builtin.copy:
    content: |
      POSTGRES_PASSWORD={{ docker_db_password }}
    dest: "{{ docker_compose_dir }}/.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: Run the compose project
  community.docker.docker_compose_v2:
    project_src: "{{ docker_compose_dir }}"
    project_name: "{{ docker_compose_project }}"
    state: present
    pull: missing
    wait: true
    wait_timeout: 300
