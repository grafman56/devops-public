---
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Users added to the docker group. Membership is equivalent to root access.
docker_users: []

docker_compose_project: example
docker_compose_dir: /opt/example

# Docker publishes per distribution release. Override when Docker has not yet
# published packages for a brand-new Ubuntu or Debian release.
docker_apt_suite: "{{ ansible_facts['distribution_release'] }}"

docker_web_image: nginx:1.30.6-alpine
docker_db_image: postgres:18.6-trixie
docker_web_port: 8080
docker_db_port: 5432

docker_db_name: appdb
docker_db_user: appuser
docker_db_password: "change-me"
