---
# Promote the first domain controller for a new forest.
#
# The safe mode password comes from Vault via the vault_ variable. It is never
# written into the repository.

- name: Install the AD DS role
  ansible.windows.win_feature:
    name: AD-Domain-Services
    include_management_tools: true
    include_sub_features: true
    state: present
  register: adds_feature

- name: Reboot after the feature install
  ansible.windows.win_reboot:
    reboot_timeout: 900
    post_reboot_delay: 30
  when: adds_feature.reboot_required | default(false)

- name: Create the forest
  microsoft.ad.domain:
    dns_domain_name: "{{ domain_name }}"
    domain_netbios_name: "{{ domain_netbios_name }}"
    safe_mode_password: "{{ vault_safe_mode_password }}"
    install_dns: true
    reboot: true
    reboot_timeout: 1800
  register: forest_result

- name: Read back the domain DNS root
  ansible.windows.win_shell: (Get-ADDomain -Identity {{ domain_name }}).DNSRoot
  register: domain_check
  changed_when: false

- name: Assert the domain is the one we asked for
  ansible.builtin.assert:
    that:
      - domain_check.stdout | trim == domain_name
    fail_msg: "Get-ADDomain returned '{{ domain_check.stdout | trim }}', expected '{{ domain_name }}'"

- name: Report the functional level so the runbook records it
  ansible.windows.win_shell: |
    $d = Get-ADDomain
    "DomainMode=$($d.DomainMode)"
    "ForestMode=$((Get-ADForest).ForestMode)"
    "NetBIOS=$($d.NetBIOSName)"
    "PDC=$($d.PDCEmulator)"
  register: domain_levels
  changed_when: false

- name: Show the functional levels
  ansible.builtin.debug:
    var: domain_levels.stdout_lines

- name: Point the DC at itself for DNS
  ansible.windows.win_dns_client:
    interface: "{{ dns_interface }}"
    dns_servers:
      - 127.0.0.1

- name: Set the DNS forwarders
  ansible.windows.win_shell: |
    Set-DnsServerForwarder -IPAddress {{ domain_dns_forwarders | join(',') }}
  changed_when: false
  failed_when: false

- name: Prove the DC answers DNS for its own zone
  ansible.windows.win_shell: Resolve-DnsName -Name {{ domain_name }} -Server 127.0.0.1 -Type SOA | Select-Object -First 1 -ExpandProperty Name
  register: soa
  changed_when: false
  failed_when: soa.rc != 0
